
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Login | Brahmastra Academy</title>
<style>
*{box-sizing:border-box}
body{
margin:0;background:#eef1f8;font-family:Arial;
display:flex;justify-content:center;align-items:center;
min-height:100vh;padding:20px
}
.login{
background:white;width:100%;max-width:400px;
padding:28px;border-radius:16px;
box-shadow:0 5px 25px #ccd2df
}
h2{text-align:center;color:#14264e}
p{text-align:center;color:#666}
input{
width:100%;padding:14px;margin:10px 0;
border:1px solid #ccc;border-radius:8px;font-size:16px
}
button{
width:100%;padding:14px;background:#14264e;
color:white;border:0;border-radius:8px;
font-size:16px;font-weight:bold
}
a{color:#14264e}
</style>
</head>
<body>
<div class="login">
<h2>BRAHMASTRA ACADEMY</h2>
<p>Student Login</p>

<form id="loginForm">
<input type="email" placeholder="Email Address" required>
<input type="password" placeholder="Password" required>
<button type="submit">Login</button>
</form>

<p>New Student? <a href="register.html">Create Account</a></p>
<p><a href="index.html">Back to Home</a></p>
</div>
<script>
document.getElementById("loginForm").addEventListener("submit",function(e){
e.preventDefault();
alert("Login system abhi Supabase se connect hona baki hai.");
});
</script>
</body>
</html>
